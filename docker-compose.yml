# ============================================================================
# docker-compose.yml - Dona Sogra (Ambiente Docker Local)
# ============================================================================

version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: donasogra-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dougl628_dona_sogra
      MYSQL_USER: dougl628_root
      MYSQL_PASSWORD: donasogra@2026
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/migrations.sql:/docker-entrypoint-initdb.d/2_migrations.sql

volumes:
  db_data:
